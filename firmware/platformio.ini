; FCB1010 -> ESP32-S3 (USB MIDI ovladac pro DAW)
; Platforma pioarduino = arduino-esp32 3.x (trida USBMIDI je az v jadru 3.x,
; oficialni platforma "espressif32" zustala na jadru 2.x).
; Verze jsou pripnute na sestaveni, ktere proslo: platforma 55.03.312
; (arduino-esp32 3.3.12), Adafruit NeoPixel 1.15.5. Zvedat vedome, ne aliasem "stable".

[env:fcb1010]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; "deep": knihovna USB v jadru 3.3.x si sama taha FS, vychozi LDF ji nenajde
lib_ldf_mode = deep

; Deska ma ve vychozim stavu ARDUINO_USB_MODE=1 (USB-Serial/JTAG).
; Pro USB MIDI musi byt 0 (USB-OTG / TinyUSB), jinak se Macu neprihlasi jako MIDI.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
